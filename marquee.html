<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Scrolling Marquee</title>
    <link rel="stylesheet" href="marquee.css">
</head>
<body>
    <div class="marquee-wrapper">
        <div class="marquee-header">
            <h2>Infinite Scrolling Marquee</h2>
            <p>Hover the banner to pause it</p>
        </div>
        
        <!-- The dark banner background -->
        <div class="marquee-banner">
            <!-- The moving track containing the text -->
            <div class="marquee-track">
                <!-- Set 1 -->
                <span class="marquee-item">CSS</span>
                <span class="marquee-item">JavaScript</span>
                <span class="marquee-item">Git</span>
                <span class="marquee-item">GitHub</span>
                <span class="marquee-item">VS Code</span>
                <span class="marquee-item">HTML</span>
                
                <!-- Set 2 (Exact Duplicate for seamless loop) -->
                <span class="marquee-item">CSS</span>
                <span class="marquee-item">JavaScript</span>
                <span class="marquee-item">Git</span>
                <span class="marquee-item">GitHub</span>
                <span class="marquee-item">VS Code</span>
                <span class="marquee-item">HTML</span>
            </div>
        </div>
    </div>
</body>
</html>
